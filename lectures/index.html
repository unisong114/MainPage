---
layout: default
title: 강의/서비스
---
<section class="section">
  <div class="container">
    <h1 class="section__title">강의/서비스</h1>
    <p class="section__desc">기업 출강, 데이터 자동화 컨설팅 등 Microsoft 기술 관련 서비스를 제공합니다.</p>
    <div class="card-grid">
      {% assign lectures = site.lectures | sort: "order" %}
      {% for lecture in lectures %}
      <div class="card">
        <p class="card__title">{{ lecture.title }}</p>
        <p class="card__meta">{{ lecture.audience }} · {{ lecture.duration }}</p>
        <p class="card__desc">{{ lecture.summary }}</p>
        <a class="card__link" href="{{ lecture.url | relative_url }}">자세히 보기 →</a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
