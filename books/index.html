---
layout: default
title: 집필/도서
---
<section class="section">
  <div class="container">
    <h1 class="section__title">집필/도서</h1>
    <p class="section__desc">Microsoft 기술 실무를 다룬 저서를 소개합니다.</p>
    <div class="card-grid">
      {% assign books = site.books | sort: "order" %}
      {% for book in books %}
      <div class="card">
        <p class="card__title">{{ book.title }}</p>
        <p class="card__meta">{{ book.publisher }} · {{ book.published_date }}</p>
        <a class="card__link" href="{{ book.url | relative_url }}">책 소개 보기 →</a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
