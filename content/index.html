---
layout: default
title: 콘텐츠/자료
---
<section class="section">
  <div class="container">
    <h1 class="section__title">콘텐츠/자료</h1>
    <p class="section__desc">Power BI, Copilot 관련 실무 인사이트와 강의 자료를 공유합니다.</p>
    <div class="card-grid">
      {% for post in site.posts %}
      <div class="card">
        <p class="card__meta">{{ post.date | date: "%Y.%m.%d" }}</p>
        <p class="card__title">{{ post.title }}</p>
        <p class="card__desc">{{ post.summary }}</p>
        <a class="card__link" href="{{ post.url | relative_url }}">읽어보기 →</a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
