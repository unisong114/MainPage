title: 송영훈 | Power BI & Copilot 강의·컨설팅
description: Power BI, Microsoft Copilot 등 Microsoft 기술 강의, 개발, 집필을 진행하는 1인기업 홈페이지입니다.
lang: ko

# TODO: 실제 연락처 이메일로 교체
email: contact@example.com

url: "https://yhsong.github.io"

markdown: kramdown
plugins:
  - jekyll-feed

collections:
  lectures:
    output: true
    permalink: /lectures/:path/
  books:
    output: true
    permalink: /books/:path/

defaults:
  - scope:
      path: ""
      type: "lectures"
    values:
      layout: "lecture"
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
